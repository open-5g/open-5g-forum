name: Build & Publish Ruby Gem
# Gets triggered upon the creation of a new tag
on:
  push:
    tags:
    - 'v*' # Matches tags with the name "v*", i.e. v1.0, v20.15.10
# Performs the following steps:
#   - Sets the environment up
#   - Builds the gem
#   - Uploads the gem to RubyGem
#   - Creates (or updates) the GitHub release and attaches the gem to it
permissions:
  contents: write

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      id: checkout_code
      uses: actions/checkout@v4

    - name: Set up Ruby
      id: setup_ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'

    - name: Publish to RubyGems
      id: publish_rubygems
      run: |
        mkdir -p $HOME/.gem
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        echo "---" >> $HOME/.gem/credentials
        echo ":rubygems_api_key: ${RUBYGEMS_API_KEY}" >> $HOME/.gem/credentials
        gem build *.gemspec
        gem push *.gem
        mv *.gem jekyll-theme-conference.gem
      env:
        RUBYGEMS_API_KEY: ${{secrets.RUBYGEMS_API_KEY}}

    - name: Create Release and upload Gem
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        files: jekyll-theme-conference.gem
